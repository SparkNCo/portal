name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Points CI at the dev schema so tests never touch production data,
      # regardless of what NEXT_PUBLIC_SUPABASE_SCHEMA is set to elsewhere.
      NEXT_PUBLIC_SUPABASE_SCHEMA: portaldev
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_APIKEY: ${{ secrets.NEXT_PUBLIC_APIKEY }}
      NEXT_PUBLIC_ENDPOINT: ${{ secrets.NEXT_PUBLIC_ENDPOINT }}
      NEXT_PUBLIC_GOOGLE_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_API_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_COMET_AI_UID: ${{ secrets.NEXT_PUBLIC_COMET_AI_UID }}
      NEXT_PUBLIC_COMET_ADMIN_UID: ${{ secrets.NEXT_PUBLIC_COMET_ADMIN_UID }}
      NEXT_PUBLIC_COMET_APP_ID: ${{ secrets.NEXT_PUBLIC_COMET_APP_ID }}
      NEXT_PUBLIC_COMET_REGION: ${{ secrets.NEXT_PUBLIC_COMET_REGION }}
      NEXT_PUBLIC_COMET_AUTH_KEY: ${{ secrets.NEXT_PUBLIC_COMET_AUTH_KEY }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      TEST_DEVELOPER_EMAIL: ${{ secrets.TEST_DEVELOPER_EMAIL }}
      TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_HOLDER_EMAIL: ${{ secrets.TEST_HOLDER_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_HOLDER_PASSWORD: ${{ secrets.TEST_HOLDER_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
