name: Playwright Tests
# Disabled while the npm ci CI failure is being investigated — no automatic
# trigger, so this workflow won't run (or show any check) on push/PR for any
# branch. Restore the push/pull_request triggers below to re-enable.
on:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_COMET_AI_UID: ${{ secrets.NEXT_PUBLIC_COMET_AI_UID }}
      NEXT_PUBLIC_COMET_ADMIN_UID: ${{ secrets.NEXT_PUBLIC_COMET_ADMIN_UID }}
      NEXT_PUBLIC_COMET_APP_ID: ${{ secrets.NEXT_PUBLIC_COMET_APP_ID }}
      NEXT_PUBLIC_COMET_AUTH_KEY: ${{ secrets.NEXT_PUBLIC_COMET_AUTH_KEY }}
      TEST_DEVELOPER_EMAIL: ${{ secrets.TEST_DEVELOPER_EMAIL }}
      TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_HOLDER_EMAIL: ${{ secrets.TEST_HOLDER_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_HOLDER_PASSWORD: ${{ secrets.TEST_HOLDER_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
