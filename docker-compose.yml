# Runs the portal in Docker:   docker compose up --build
# Then open http://localhost:3000
#
# The ${...} values are read from .env in this folder (Docker Compose does
# that on its own). See README.md → "Running with Docker".

services:
  portal:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_KEY: ${NEXT_PUBLIC_SUPABASE_KEY}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_COMET_APP_ID: ${NEXT_PUBLIC_COMET_APP_ID:-}
        NEXT_PUBLIC_COMET_AUTH_KEY: ${NEXT_PUBLIC_COMET_AUTH_KEY:-}
        NEXT_PUBLIC_COMET_ADMIN_UID: ${NEXT_PUBLIC_COMET_ADMIN_UID:-}
        NEXT_PUBLIC_COMET_AI_UID: ${NEXT_PUBLIC_COMET_AI_UID:-}
        # The portal's public address, e.g. https://portal.example.com
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    # Another name keeps a second deploy (e.g. against the self-hosted
    # Supabase) from replacing this image. See docs/LOCAL_SUPABASE.md.
    image: ${IMAGE_NAME:-sparkco-portal}
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
